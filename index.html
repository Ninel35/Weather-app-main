<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Weather app</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo">
          <img
            src="./assets/images/logo.svg"
            alt="logo"
            width="90px"
            height=""
          />
        </div>
       
<div class="container">
  <!-- hidden checkbox -->
  <input type="checkbox" id="toggle">

  <!-- label controls checkbox -->
  <label for="toggle" class="header">
    
     <img class="icon-units"
     src="./assets/images/icon-units.svg"
     alt="units"
     width="15px"
     height="15px"
     />
<span>Units</span>
    <span class="arrow">▼</span>
  </label>

  <!-- dropdown -->
  <div class="dropdown">
    <div class="button">Switch to Imperial</div>
<div>Temperature</div>
    <div class="option selected" data-type="temp" data-value="c">
  Celsius (°C) <span class="check">✔</span>
</div>

<div class="option" data-type="temp" data-value="f">
  Fahrenheit (°F)
</div>

<div>Wind speed</div>
<div class="option selected" data-type="wind" data-value="kmh">
  km/h <span class="check">✔</span>
</div>

<div class="option" data-type="wind" data-value="mph">
  mph
</div>

<div>Precipitation</div>
<div class="option selected" data-type="rain" data-value="mm">
  Millimeters (mm) <span class="check">✔</span>
</div>

<div class="option" data-type="rain" data-value="inch">
  Inches (in)
</div>

  </div>
</div>

       
      </header>

      <h1 class="text-header">How's the sky looking today?</h1>
      <div class="search-field">
        <form class="search-form">
          <label class="label">
            <img
              class="icon-search"
              src="./assets/images/icon-search.svg"
              width="15"
              alt="search"
            />
            <!-- <div class="search-box"> -->
              <input
                class="search-input"
                type="text"
                placeholder="Search for place..."
              />
                <!-- <ul class="options"></ul> -->
            <!-- </div> -->
          </label>
          <button type="submit">Search</button>
        </form>
      </div>

      <div class="content">
        <div class="left">
          <div class="weather-info temperature"></div>

          <!-- <div class="stat-card"></div> -->
        </div>

         
            <div class="hourly">
              <div class="header">
                <h3>Hourly forecast</h3>
                <select class="day-select"></select>
              </div>
            
            <div class="hourly-list"></div>
          </div>

</div>


    <!-- Insert hourly forecast for the selected day here -->
    <script src="./code.js" type="module"></script>
  </body>
</html>
